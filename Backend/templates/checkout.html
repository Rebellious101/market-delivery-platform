<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ödeme ve Sipariş</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h1>Checkout / Ödeme</h1>
    <nav>
        <a href="/">Ana Sayfa</a>
        <a href="/sepet">🛒 Sepetim</a>
    </nav>
</header>

<main>
    <section>
        {% if success %}
            <div style="background: #e8f8f5; border: 1px solid #27ae60; padding: 20px; border-radius: 5px; text-align: center;">
                <h2 style="color: #27ae60;">Siparişiniz Başarıyla Alındı!</h2>
                <p>Sipariş Numaranız: <strong>#{{ order_id }}</strong></p>
                <p>Teşekkür ederiz, alışverişiniz başarıyla tamamlandı.</p>
                <a href="/" style="display: inline-block; margin-top: 15px; padding: 10px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 5px;">Alışverişe Devam Et</a>
            </div>
        {% else %}
            <p>Ödeme veya sepet bilgisi bulunamadı.</p>
        {% endif %}
    </section>
</main>

</body>
</html>
