<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Girişi | Market Admin</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
<main class="login-shell">
	<section class="login-card">
		<div class="login-mark">M</div>
		<p class="eyebrow">MARKET ADMIN</p>
		<h1>Hoş geldin</h1>
		<p class="muted">Ürünleri, kategorileri ve siparişleri yönetmek için giriş yap.</p>
		{% with messages = get_flashed_messages(with_categories=true) %}
			{% for category, message in messages %}
				<div class="flash flash-{{ category }}">{{ message }}</div>
			{% endfor %}
		{% endwith %}
		<form method="POST" class="login-form">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
			<label>
				Kullanıcı adı
				<input type="text" name="username" autocomplete="username" required autofocus>
			</label>
			<label>
				Şifre
				<input type="password" name="password" autocomplete="current-password" required>
			</label>
			<button class="button button-primary" type="submit">Admin paneline gir</button>
		</form>
		<a class="back-link" href="/">Mağazaya dön</a>
	</section>
</main>
</body>
</html>
