<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürünü Düzenle | Market Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <div>
        <p class="eyebrow">KATALOG</p>
        <h1>Ürünü Düzenle</h1>
    </div>
    <nav class="nav-links">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_products') }}">Ürünler</a>
        <a href="{{ url_for('admin_categories') }}">Kategoriler</a>
        <a href="{{ url_for('admin_logout') }}">Çıkış</a>
    </nav>
</header>
<main class="admin-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <section class="panel">
        <div class="panel-heading">
            <div>
                <p class="eyebrow">ÜRÜN #{{ product.id }}</p>
                <h2>{{ product.name }}</h2>
            </div>
            {% if product.image %}
                <img class="edit-preview" src="{{ url_for('static', filename='uploads/' ~ product.image) }}" alt="{{ product.name }}">
            {% endif %}
        </div>
        <form method="POST" enctype="multipart/form-data" class="product-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>
                Ürün adı
                <input type="text" name="name" value="{{ product.name }}" required>
            </label>
            <label>
                Kategori
                <select name="category_id" required>
                    {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == product.category_id %}selected{% endif %}>{{ category.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                Fiyat (TL)
                <input type="number" name="price" min="0" step="0.01" value="{{ product.price }}" required>
            </label>
            <label>
                Stok adedi
                <input type="number" name="stock" min="0" step="1" value="{{ product.stock }}" required>
            </label>
            <label class="full-width">
                Açıklama
                <textarea name="description" rows="4">{{ product.description or '' }}</textarea>
            </label>
            <label class="upload-field full-width">
                Yeni görsel (isteğe bağlı)
                <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif">
                <small>Yeni görsel seçmezseniz mevcut görsel korunur.</small>
            </label>
            <div class="form-actions full-width">
                <a class="button button-secondary" href="{{ url_for('admin_products') }}">Vazgeç</a>
                <button class="button button-primary" type="submit">Değişiklikleri kaydet</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
