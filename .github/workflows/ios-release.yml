name: iOS Release (TestFlight)

# Sadece elle çalışır: GitHub > Actions > "iOS Release (TestFlight)" > Run workflow
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_SPECIFIER: "com.prestijmarket.app AppStore"
      APP_BUNDLE_ID: "com.prestijmarket.app"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Setup temporary Keychain & App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_pass_123"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Fetch Distribution Certificate & Provisioning Profile
        working-directory: market_app/ios
        run: |
          set -o pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_pass_123"

          pip3 install --quiet pyjwt cryptography requests

          if ! python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/signing.log"; then
          import base64, os, subprocess, sys, time
          import jwt, requests

          key_id = os.environ["KEY_ID"].strip()
          issuer_id = os.environ["ISSUER_ID"].strip()
          team_id = os.environ["TEAM_ID"].strip()
          bundle_id_str = os.environ["APP_BUNDLE_ID"].strip()
          profile_name_target = os.environ["PROFILE_SPECIFIER"].strip()
          runner_temp = os.environ["RUNNER_TEMP"]
          p8_path = os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")

          with open(p8_path, "r") as f:
              p8_key = f.read().strip()

          token = jwt.encode(
              {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1",
              },
              p8_key,
              algorithm="ES256",
              headers={"kid": key_id},
          )
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }
          base_url = "https://api.appstoreconnect.apple.com/v1"

          # 1. Mevcut DISTRIBUTION sertifikalarını kontrol et (geçici runner'lardan kalan private key'siz sertifikaları temizle)
          r = requests.get(f"{base_url}/certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION", headers=headers)
          r.raise_for_status()
          existing_certs = r.json().get("data", [])
          print(f"Found {len(existing_certs)} existing Distribution certificate(s) on portal.")
          for c in existing_certs:
              cid = c["id"]
              cname = c["attributes"].get("displayName") or c["attributes"].get("name")
              print(f"Removing orphaned CI certificate without local private key: {cid} ({cname})")
              del_r = requests.delete(f"{base_url}/certificates/{cid}", headers=headers)
              print(f"Delete cert {cid} status: {del_r.status_code}")

          # 2. Yeni RSA-2048 Private Key ve CSR üret, tek bir Apple Distribution sertifikası oluştur
          key_file = os.path.join(runner_temp, "dist.key")
          csr_file = os.path.join(runner_temp, "dist.csr")
          cer_der_file = os.path.join(runner_temp, "dist.cer")
          cer_pem_file = os.path.join(runner_temp, "dist.pem")
          p12_file = os.path.join(runner_temp, "dist.p12")
          p12_pass = "ci_p12_pass_123"

          subprocess.run([
              "openssl", "req", "-new", "-newkey", "rsa:2048", "-nodes",
              "-keyout", key_file, "-out", csr_file,
              "-subj", "/CN=Prestij Market Distribution/O=Prestij Market/C=TR"
          ], check=True)

          with open(csr_file, "r") as f:
              csr_pem = f.read()
          csr_body = "".join(
              line.strip() for line in csr_pem.splitlines()
              if not line.startswith("-----")
          )

          create_cert_r = requests.post(
              f"{base_url}/certificates",
              headers=headers,
              json={
                  "data": {
                      "type": "certificates",
                      "attributes": {
                          "certificateType": "DISTRIBUTION",
                          "csrContent": csr_body,
                      },
                  }
              },
          )
          if create_cert_r.status_code >= 300:
              print("Create certificate error:", create_cert_r.text)
              create_cert_r.raise_for_status()

          cert_data = create_cert_r.json()["data"]
          cert_id = cert_data["id"]
          cert_content_b64 = cert_data["attributes"]["certificateContent"]
          print(f"Created Apple Distribution Certificate ID: {cert_id}")

          with open(cer_der_file, "wb") as f:
              f.write(base64.b64decode(cert_content_b64))

          subprocess.run(["openssl", "x509", "-inform", "DER", "-in", cer_der_file, "-out", cer_pem_file], check=True)
          subprocess.run([
              "openssl", "pkcs12", "-export", "-legacy",
              "-inkey", key_file, "-in", cer_pem_file,
              "-out", p12_file, "-passout", f"pass:{p12_pass}"
          ], check=True)

          # 3. Bundle ID kaynağını bul
          b_r = requests.get(f"{base_url}/bundleIds?filter[identifier]={bundle_id_str}", headers=headers)
          b_r.raise_for_status()
          bundles = [b for b in b_r.json().get("data", []) if b["attributes"]["identifier"] == bundle_id_str]
          if not bundles:
              raise RuntimeError(f"Bundle ID '{bundle_id_str}' not found in Apple Developer account!")
          bundle_res_id = bundles[0]["id"]
          print(f"Found Bundle ID resource: {bundle_res_id} ({bundle_id_str})")

          # 4. Fazla üretilmiş "com.prestijmarket.app AppStore 1795026401" ve eski profilleri temizleyip
          #    yalnızca tek bir "com.prestijmarket.app AppStore" profilini aktif sertifika ile güncelle
          p_r = requests.get(f"{base_url}/profiles", headers=headers)
          p_r.raise_for_status()
          for p in p_r.json().get("data", []):
              pid = p["id"]
              pname = p["attributes"].get("name", "")
              if pname == profile_name_target or pname.startswith(profile_name_target + " "):
                  print(f"Cleaning up old/duplicate profile: {pid} ('{pname}')")
                  requests.delete(f"{base_url}/profiles/{pid}", headers=headers)

          create_prof_r = requests.post(
              f"{base_url}/profiles",
              headers=headers,
              json={
                  "data": {
                      "type": "profiles",
                      "attributes": {
                          "name": profile_name_target,
                          "profileType": "IOS_APP_STORE",
                      },
                      "relationships": {
                          "bundleId": {
                              "data": {"type": "bundleIds", "id": bundle_res_id}
                          },
                          "certificates": {
                              "data": [{"type": "certificates", "id": cert_id}]
                          },
                      },
                  }
              },
          )
          if create_prof_r.status_code >= 300:
              print("Create profile error:", create_prof_r.text)
              create_prof_r.raise_for_status()

          prof_data = create_prof_r.json()["data"]
          prof_b64 = prof_data["attributes"]["profileContent"]
          prof_uuid = prof_data["attributes"]["uuid"]
          prof_path = os.path.join(runner_temp, "AppStore.mobileprovision")
          with open(prof_path, "wb") as f:
              f.write(base64.b64decode(prof_b64))
          print(f"Provisioning profile '{profile_name_target}' (UUID: {prof_uuid}) saved to {prof_path}")
          PY
            echo "### Signing Setup Error" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/signing.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # P12 sertifikasını ve private key'i Keychain'e aktar
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "ci_p12_pass_123" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Verify Provisioning Profile & Certificate Match
        working-directory: market_app/ios
        run: |
          set -o pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          PROFILE_FILE="$RUNNER_TEMP/AppStore.mobileprovision"

          {
            if [ ! -f "$PROFILE_FILE" ]; then
              echo "::error::Provisioning profile file not found at $PROFILE_FILE"
              exit 1
            fi

            # Profili decode et ve alanları doğrula
            security cms -D -i "$PROFILE_FILE" > "$RUNNER_TEMP/profile.plist"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
            PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
            PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")

            echo "=== PROVISIONING PROFILE METADATA ==="
            echo "Name                   : $PROFILE_NAME"
            echo "UUID                   : $PROFILE_UUID"
            echo "TeamIdentifier         : $PROFILE_TEAM"
            echo "application-identifier : $PROFILE_APP_ID"
            echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

            if [ "$PROFILE_NAME" != "$PROFILE_SPECIFIER" ]; then
              echo "::error::Profile Name mismatch! Expected '$PROFILE_SPECIFIER', got '$PROFILE_NAME'"
              exit 1
            fi
            if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
              echo "::error::Profile TeamIdentifier mismatch! Expected '$TEAM_ID', got '$PROFILE_TEAM'"
              exit 1
            fi
            if [ "$PROFILE_APP_ID" != "${TEAM_ID}.${APP_BUNDLE_ID}" ]; then
              echo "::error::Profile application-identifier mismatch! Expected '${TEAM_ID}.${APP_BUNDLE_ID}', got '$PROFILE_APP_ID'"
              exit 1
            fi

            # ~/Library/MobileDevice/Provisioning Profiles/ (ve Xcode 16 UserData) dizinine kur ve doğrula
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            cp "$PROFILE_FILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            cp "$PROFILE_FILE" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

            echo "=== INSTALLED PROFILES IN ~/Library/MobileDevice/Provisioning Profiles/ ==="
            ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

            # Apple Distribution sertifikası (Keychain'deki private key'li kimlik) ile profildeki sertifikanın eşleştiğini doğrula
            echo "=== KEYCHAIN SIGNING IDENTITIES ==="
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/identities.txt"

            python3 - <<'PY'
            import hashlib, os, plistlib, re, sys

            runner_temp = os.environ["RUNNER_TEMP"]
            with open(os.path.join(runner_temp, "profile.plist"), "rb") as f:
                plist = plistlib.load(f)

            profile_cert_sha1s = [
                hashlib.sha1(cert_der).hexdigest().upper()
                for cert_der in plist.get("DeveloperCertificates", [])
            ]
            print("Profile DeveloperCertificates SHA-1:", profile_cert_sha1s)

            with open(os.path.join(runner_temp, "identities.txt"), "r") as f:
                identities_text = f.read()

            keychain_sha1s = re.findall(r'\b([0-9A-Fa-f]{40})\b\s+"[^"]*Distribution:', identities_text)
            keychain_sha1s = [s.upper() for s in keychain_sha1s]
            print("Keychain Distribution SHA-1 (with private key):", keychain_sha1s)

            matched = set(profile_cert_sha1s) & set(keychain_sha1s)
            if not keychain_sha1s:
                print("::error::Keychain'de private key'e sahip geçerli bir Distribution sertifikası bulunamadı!")
                sys.exit(1)
            if not matched:
                print(f"::error::Profil içindeki sertifika ({profile_cert_sha1s}) ile Keychain'deki sertifika ({keychain_sha1s}) eşleşmiyor!")
                sys.exit(1)

            print(f"Verified matching certificate SHA-1: {list(matched)}")
            PY

            # Sadece Runner hedefinin imzalama ayarlarını doğrula (SPM paket hedeflerine dokunmaz)
            fastlane run update_code_signing_settings \
              use_automatic_signing:false \
              path:"Runner.xcodeproj" \
              team_id:"$TEAM_ID" \
              targets:"Runner" \
              code_sign_identity:"Apple Distribution" \
              profile_name:"$PROFILE_SPECIFIER" \
              profile_uuid:"$PROFILE_UUID" \
              bundle_identifier:"$APP_BUNDLE_ID"
          } 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Flutter pub get
        working-directory: market_app
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Generate iOS build config (no codesign)
        working-directory: market_app
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archive
        working-directory: market_app/ios
        run: |
          set -o pipefail
          if ! xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" 2>&1 | tee "$RUNNER_TEMP/archive.log"; then
            echo "=== XCODE ARCHIVE ERRORS ==="
            grep -E "error:|warning:.*Signing|Provisioning|certificate|requires a" "$RUNNER_TEMP/archive.log" || true
            echo "### Xcode Archive Error Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|warning:.*Signing|Provisioning|certificate|requires a" "$RUNNER_TEMP/archive.log" | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 60 "$RUNNER_TEMP/archive.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 65
          fi

      - name: Export and upload to App Store Connect (TestFlight)
        working-directory: market_app/ios
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.prestijmarket.app</key>
              <string>${PROFILE_SPECIFIER}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"; then
            echo "### Xcode Export Error Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 "$RUNNER_TEMP/export.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: ${{ runner.temp }}/*.log

      - name: Cleanup Keychain and API key
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
