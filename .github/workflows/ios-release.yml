name: iOS Release (TestFlight)

# Sadece elle çalışır: GitHub > Actions > "iOS Release (TestFlight)" > Run workflow
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_SPECIFIER: "com.prestijmarket.app AppStore"
      APP_BUNDLE_ID: "com.prestijmarket.app"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Setup temporary Keychain & App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

          python3 - <<'PY'
          import json, os
          key_id = os.environ["KEY_ID"].strip()
          issuer_id = os.environ["ISSUER_ID"].strip()
          key_content = os.environ["API_KEY_P8"].strip()
          api_json_path = os.path.expanduser("~/private_keys/api_key.json")
          with open(api_json_path, "w") as f:
              json.dump({
                  "key_id": key_id,
                  "issuer_id": issuer_id,
                  "key": key_content,
                  "duration": 1200,
                  "in_house": False,
              }, f)
          PY

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_pass_123"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Fetch Distribution Certificate & Provisioning Profile
        working-directory: market_app/ios
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_pass_123"
          API_JSON="$HOME/private_keys/api_key.json"

          # 1. Apple Distribution sertifikasını indir / yükle
          fastlane run get_certificates \
            api_key_path:"$API_JSON" \
            development:false \
            generate_apple_certs:true \
            keychain_path:"$KEYCHAIN_PATH" \
            keychain_password:"$KEYCHAIN_PASS"

          # 2. Mevcut "com.prestijmarket.app AppStore" profilini yeni profil üretmeden (readonly:true) indir
          fastlane run get_provisioning_profile \
            api_key_path:"$API_JSON" \
            app_identifier:"$APP_BUNDLE_ID" \
            provisioning_name:"$PROFILE_SPECIFIER" \
            development:false \
            readonly:true \
            output_path:"$RUNNER_TEMP" \
            filename:"AppStore.mobileprovision"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Verify Provisioning Profile & Certificate Match
        working-directory: market_app/ios
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          PROFILE_FILE="$RUNNER_TEMP/AppStore.mobileprovision"

          if [ ! -f "$PROFILE_FILE" ]; then
            echo "::error::Provisioning profile file not found at $PROFILE_FILE"
            exit 1
          fi

          # Profili decode et ve alanları doğrula
          security cms -D -i "$PROFILE_FILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")

          echo "=== PROVISIONING PROFILE METADATA ==="
          echo "Name                   : $PROFILE_NAME"
          echo "UUID                   : $PROFILE_UUID"
          echo "TeamIdentifier         : $PROFILE_TEAM"
          echo "application-identifier : $PROFILE_APP_ID"

          if [ "$PROFILE_NAME" != "$PROFILE_SPECIFIER" ]; then
            echo "::error::Profile Name mismatch! Expected '$PROFILE_SPECIFIER', got '$PROFILE_NAME'"
            exit 1
          fi
          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "::error::Profile TeamIdentifier mismatch! Expected '$TEAM_ID', got '$PROFILE_TEAM'"
            exit 1
          fi
          if [ "$PROFILE_APP_ID" != "${TEAM_ID}.${APP_BUNDLE_ID}" ]; then
            echo "::error::Profile application-identifier mismatch! Expected '${TEAM_ID}.${APP_BUNDLE_ID}', got '$PROFILE_APP_ID'"
            exit 1
          fi

          # ~/Library/MobileDevice/Provisioning Profiles/ (ve Xcode 16 UserData) dizinine kur ve doğrula
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PROFILE_FILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          cp "$PROFILE_FILE" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "=== INSTALLED PROFILES IN ~/Library/MobileDevice/Provisioning Profiles/ ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

          # Apple Distribution sertifikası (Keychain'deki private key'li kimlik) ile profildeki sertifikanın eşleştiğini doğrula
          echo "=== KEYCHAIN SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/identities.txt"

          python3 - <<'PY'
          import hashlib, os, plistlib, re, subprocess, sys

          runner_temp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(runner_temp, "profile.plist"), "rb") as f:
              plist = plistlib.load(f)

          profile_cert_sha1s = [
              hashlib.sha1(cert_der).hexdigest().upper()
              for cert_der in plist.get("DeveloperCertificates", [])
          ]
          print("Profile DeveloperCertificates SHA-1:", profile_cert_sha1s)

          with open(os.path.join(runner_temp, "identities.txt"), "r") as f:
              identities_text = f.read()

          keychain_sha1s = re.findall(r'\b([0-9A-Fa-f]{40})\b\s+"Apple Distribution:', identities_text)
          keychain_sha1s = [s.upper() for s in keychain_sha1s]
          print("Keychain Apple Distribution SHA-1 (with private key):", keychain_sha1s)

          matched = set(profile_cert_sha1s) & set(keychain_sha1s)
          if not keychain_sha1s:
              print("::error::Keychain'de private key'e sahip geçerli bir 'Apple Distribution' sertifikası bulunamadı! (Önceki geçici CI çalışmasında üretilen sertifikanın private key'i runner silinince kaybolmuş.)")
              sys.exit(1)
          if not matched:
              print(f"::error::Profil içindeki sertifika ({profile_cert_sha1s}) ile Keychain'deki sertifika ({keychain_sha1s}) eşleşmiyor!")
              sys.exit(1)

          print(f"Verified matching certificate SHA-1: {list(matched)}")
          PY

      - name: Flutter pub get
        working-directory: market_app
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Generate iOS build config (no codesign)
        working-directory: market_app
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archive
        working-directory: market_app/ios
        run: |
          set -o pipefail
          if ! xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" 2>&1 | tee "$RUNNER_TEMP/archive.log"; then
            echo "=== XCODE ARCHIVE ERRORS ==="
            grep -E "error:|warning:.*Signing|Provisioning|certificate|requires a" "$RUNNER_TEMP/archive.log" || true
            echo "### Xcode Archive Error Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|warning:.*Signing|Provisioning|certificate|requires a" "$RUNNER_TEMP/archive.log" | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 60 "$RUNNER_TEMP/archive.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 65
          fi

      - name: Export and upload to App Store Connect (TestFlight)
        working-directory: market_app/ios
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.prestijmarket.app</key>
              <string>${PROFILE_SPECIFIER}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"; then
            echo "### Xcode Export Error Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 "$RUNNER_TEMP/export.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: ${{ runner.temp }}/*.log

      - name: Cleanup Keychain and API key
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
