name: iOS Release (TestFlight)

# Yalnızca elle tetiklenir: GitHub > Actions > "iOS Release (TestFlight)" > Run workflow
on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build, Sign & Upload iOS to TestFlight
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      RAW_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      RAW_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_SPECIFIER: "com.prestijmarket.app AppStore"
      APP_BUNDLE_ID: "com.prestijmarket.app"

    steps:
      # -----------------------------------------------------------------------
      # ADIM 1: Kaynak Kodu İndir
      # -----------------------------------------------------------------------
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # ADIM 2: Kararlı Xcode Sürümünü Seç
      # -----------------------------------------------------------------------
      - name: 2. Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # -----------------------------------------------------------------------
      # ADIM 3: Flutter SDK Kurulumu
      # -----------------------------------------------------------------------
      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      # -----------------------------------------------------------------------
      # ADIM 4: GitHub Secrets Doğrulama, Temizleme ve Geçici Keychain Kurulumu
      # -----------------------------------------------------------------------
      - name: 4. Validate Secrets, Setup Keychain & App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          # GitHub Secrets içine kopyalanırken oluşabilecek boşluk, \r, \n veya başlık satırlarını temizle
          CLEAN_TEAM_ID=$(printf '%s\n' "$RAW_TEAM_ID" | tr -d '\r' | grep -Eo '[A-Z0-9]{10}' | tail -n 1 || true)
          CLEAN_KEY_ID=$(printf '%s\n' "$RAW_KEY_ID" | tr -d '\r' | grep -Eo '[A-Z0-9]{10}' | tail -n 1 || true)
          CLEAN_ISSUER_ID=$(printf '%s\n' "$RAW_ISSUER_ID" | tr -d '\r' | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1 || true)

          if [ -z "$CLEAN_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID secret geçerli bir 10 karakterlik Apple Team ID içermiyor!"
            exit 1
          fi
          if [ -z "$CLEAN_KEY_ID" ]; then
            echo "::error::APPSTORE_KEY_ID secret geçerli bir 10 karakterlik Key ID içermiyor!"
            exit 1
          fi
          if [ -z "$CLEAN_ISSUER_ID" ]; then
            echo "::error::APPSTORE_ISSUER_ID secret geçerli bir UUID formatında Issuer ID içermiyor!"
            exit 1
          fi

          echo "TEAM_ID=$CLEAN_TEAM_ID" >> "$GITHUB_ENV"
          echo "KEY_ID=$CLEAN_KEY_ID" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$CLEAN_ISSUER_ID" >> "$GITHUB_ENV"

          echo "Secrets format check passed (Team ID length: ${#CLEAN_TEAM_ID}, Key ID length: ${#CLEAN_KEY_ID}, Issuer ID length: ${#CLEAN_ISSUER_ID})."

          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$API_KEY_P8" | tr -d '\r' > "$HOME/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"

          if ! grep -q "BEGIN PRIVATE KEY" "$HOME/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"; then
            echo "::error::APPSTORE_API_KEY_P8 secret geçerli bir .p8 (-----BEGIN PRIVATE KEY-----) içeriğine sahip değil!"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_pass_123"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Temporary keychain created and unlocked at $KEYCHAIN_PATH"

      # -----------------------------------------------------------------------
      # ADIM 5: Apple Distribution Sertifikası ve App Store Profili Hazırlama
      # -----------------------------------------------------------------------
      - name: 5. Fetch Distribution Certificate & Provisioning Profile
        working-directory: market_app/ios
        run: |
          set -o pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_pass_123"

          cat <<'PY' > "$RUNNER_TEMP/setup_signing.py"
          import base64
          import os
          import subprocess
          import time
          import jwt
          import requests

          key_id = os.environ["KEY_ID"].strip()
          issuer_id = os.environ["ISSUER_ID"].strip()
          bundle_id_str = os.environ["APP_BUNDLE_ID"].strip()
          profile_name_target = os.environ["PROFILE_SPECIFIER"].strip()
          runner_temp = os.environ["RUNNER_TEMP"]
          p8_path = os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")

          with open(p8_path, "r") as f:
              p8_key = f.read().strip()

          token = jwt.encode(
              {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1",
              },
              p8_key,
              algorithm="ES256",
              headers={"kid": key_id},
          )
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }
          base_url = "https://api.appstoreconnect.apple.com/v1"

          # 1. Geçici runner'lardan kalan private key'siz DISTRIBUTION sertifikalarını temizle
          r = requests.get(
              f"{base_url}/certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION",
              headers=headers,
              timeout=30,
          )
          r.raise_for_status()
          existing_certs = r.json().get("data", [])
          print(f"Found {len(existing_certs)} existing Distribution certificate(s) on portal.")
          for c in existing_certs:
              cid = c["id"]
              cname = c["attributes"].get("displayName") or c["attributes"].get("name")
              print(f"Revoking previous ephemeral CI certificate without local private key: {cid} ({cname})")
              del_r = requests.delete(f"{base_url}/certificates/{cid}", headers=headers, timeout=30)
              print(f"Delete cert {cid} status: {del_r.status_code}")

          # 2. Yeni RSA-2048 Private Key ve CSR üret, tek bir Apple Distribution sertifikası oluştur
          key_file = os.path.join(runner_temp, "dist.key")
          csr_file = os.path.join(runner_temp, "dist.csr")
          cer_der_file = os.path.join(runner_temp, "dist.cer")
          cer_pem_file = os.path.join(runner_temp, "dist.pem")
          p12_file = os.path.join(runner_temp, "dist.p12")
          p12_pass = "ci_p12_pass_123"

          subprocess.run(
              [
                  "openssl", "req", "-new", "-newkey", "rsa:2048", "-nodes",
                  "-keyout", key_file, "-out", csr_file,
                  "-subj", "/CN=Prestij Market Distribution/O=Prestij Market/C=TR",
              ],
              check=True,
          )

          with open(csr_file, "r") as f:
              csr_pem = f.read()
          csr_body = "".join(
              line.strip()
              for line in csr_pem.splitlines()
              if not line.startswith("-----")
          )

          create_cert_r = requests.post(
              f"{base_url}/certificates",
              headers=headers,
              json={
                  "data": {
                      "type": "certificates",
                      "attributes": {
                          "certificateType": "DISTRIBUTION",
                          "csrContent": csr_body,
                      },
                  }
              },
              timeout=30,
          )
          if create_cert_r.status_code >= 300:
              print("Create certificate error:", create_cert_r.text)
              create_cert_r.raise_for_status()

          cert_data = create_cert_r.json()["data"]
          cert_id = cert_data["id"]
          cert_content_b64 = cert_data["attributes"]["certificateContent"]
          print(f"Created Apple Distribution Certificate ID: {cert_id}")

          with open(cer_der_file, "wb") as f:
              f.write(base64.b64decode(cert_content_b64))

          subprocess.run(
              ["openssl", "x509", "-inform", "DER", "-in", cer_der_file, "-out", cer_pem_file],
              check=True,
          )
          ver = subprocess.check_output(["openssl", "version"], text=True)
          pkcs12_cmd = ["openssl", "pkcs12", "-export"]
          if "OpenSSL 3" in ver:
              pkcs12_cmd.append("-legacy")
          pkcs12_cmd += [
              "-inkey", key_file,
              "-in", cer_pem_file,
              "-out", p12_file,
              "-passout", f"pass:{p12_pass}",
          ]
          subprocess.run(pkcs12_cmd, check=True)

          # 3. Bundle ID kaynağını bul
          b_r = requests.get(
              f"{base_url}/bundleIds?filter[identifier]={bundle_id_str}",
              headers=headers,
              timeout=30,
          )
          b_r.raise_for_status()
          bundles = [
              b
              for b in b_r.json().get("data", [])
              if b["attributes"]["identifier"] == bundle_id_str
          ]
          if not bundles:
              raise RuntimeError(f"Bundle ID '{bundle_id_str}' not found in Apple Developer account!")
          bundle_res_id = bundles[0]["id"]
          print(f"Found Bundle ID resource: {bundle_res_id} ({bundle_id_str})")

          # 4. Yalnızca tek bir "com.prestijmarket.app AppStore" profilini aktif sertifika ile yenile
          p_r = requests.get(f"{base_url}/profiles", headers=headers, timeout=30)
          p_r.raise_for_status()
          deleted_any = False
          for p in p_r.json().get("data", []):
              pid = p["id"]
              pname = p["attributes"].get("name", "")
              if pname == profile_name_target or pname.startswith(profile_name_target + " "):
                  print(f"Replacing existing profile: {pid} ('{pname}')")
                  requests.delete(f"{base_url}/profiles/{pid}", headers=headers, timeout=30)
                  deleted_any = True

          if deleted_any:
              time.sleep(2)

          create_prof_r = requests.post(
              f"{base_url}/profiles",
              headers=headers,
              json={
                  "data": {
                      "type": "profiles",
                      "attributes": {
                          "name": profile_name_target,
                          "profileType": "IOS_APP_STORE",
                      },
                      "relationships": {
                          "bundleId": {
                              "data": {"type": "bundleIds", "id": bundle_res_id}
                          },
                          "certificates": {
                              "data": [{"type": "certificates", "id": cert_id}]
                          },
                      },
                  }
              },
              timeout=30,
          )
          if create_prof_r.status_code >= 300:
              print("Create profile error:", create_prof_r.text)
              create_prof_r.raise_for_status()

          prof_data = create_prof_r.json()["data"]
          prof_b64 = prof_data["attributes"]["profileContent"]
          prof_uuid = prof_data["attributes"]["uuid"]
          prof_path = os.path.join(runner_temp, "AppStore.mobileprovision")
          with open(prof_path, "wb") as f:
              f.write(base64.b64decode(prof_b64))
          print(f"Provisioning profile '{profile_name_target}' (UUID: {prof_uuid}) saved to {prof_path}")
          PY

          if ! (
            set -euo pipefail
            python3 -m venv "$RUNNER_TEMP/asc_venv"
            "$RUNNER_TEMP/asc_venv/bin/pip" install --quiet pyjwt cryptography requests
            "$RUNNER_TEMP/asc_venv/bin/python" "$RUNNER_TEMP/setup_signing.py"

            curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
            security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

            security import "$RUNNER_TEMP/dist.p12" \
              -k "$KEYCHAIN_PATH" \
              -P "ci_p12_pass_123" \
              -A \
              -T /usr/bin/codesign \
              -T /usr/bin/security \
              -T /usr/bin/productbuild

            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          ) 2>&1 | tee "$RUNNER_TEMP/signing.log"; then
            echo "### 5. Signing Setup Error" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 "$RUNNER_TEMP/signing.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # ADIM 6: Profil Metadata, Team ID ve Sertifika SHA-1 Eşleşme Doğrulaması
      # -----------------------------------------------------------------------
      - name: 6. Verify Provisioning Profile & Certificate Match
        working-directory: market_app/ios
        run: |
          set -o pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          PROFILE_FILE="$RUNNER_TEMP/AppStore.mobileprovision"

          cat <<'PY' > "$RUNNER_TEMP/verify_signing.py"
          import hashlib
          import os
          import plistlib
          import re
          import sys

          runner_temp = os.environ["RUNNER_TEMP"]
          expected_name = os.environ["PROFILE_SPECIFIER"].strip()
          expected_team = os.environ["TEAM_ID"].strip()
          expected_bundle = os.environ["APP_BUNDLE_ID"].strip()
          expected_app_id = f"{expected_team}.{expected_bundle}"

          with open(os.path.join(runner_temp, "profile.plist"), "rb") as f:
              plist = plistlib.load(f)

          prof_name = str(plist.get("Name", "")).strip()
          prof_uuid = str(plist.get("UUID", "")).strip()
          team_list = plist.get("TeamIdentifier", [])
          prof_team = str(team_list[0]).strip() if team_list else ""
          entitlements = plist.get("Entitlements", {})
          prof_app_id = str(entitlements.get("application-identifier", "")).strip()

          print("=== PROVISIONING PROFILE METADATA ===")
          print(f"Name                   : {prof_name}")
          print(f"UUID                   : {prof_uuid}")
          print(f"TeamIdentifier         : {prof_team}")
          print(f"application-identifier : {prof_app_id}")

          if prof_name != expected_name:
              print(f"::error::Profile Name mismatch! Expected '{expected_name}', got '{prof_name}'")
              sys.exit(1)

          if prof_team != expected_team:
              print(f"::error::Profile TeamIdentifier mismatch! Profile has '{prof_team}' (len={len(prof_team)}), secret has len={len(expected_team)}")
              sys.exit(1)

          if prof_app_id != expected_app_id:
              print(f"::error::Profile application-identifier mismatch! Expected '{expected_app_id}', got '{prof_app_id}'")
              sys.exit(1)

          profile_cert_sha1s = [
              hashlib.sha1(cert_der).hexdigest().upper()
              for cert_der in plist.get("DeveloperCertificates", [])
          ]
          print("Profile DeveloperCertificates SHA-1:", profile_cert_sha1s)

          with open(os.path.join(runner_temp, "identities.txt"), "r") as f:
              identities_text = f.read()

          keychain_sha1s = re.findall(r'\b([0-9A-Fa-f]{40})\b\s+"[^"]*Distribution:', identities_text)
          keychain_sha1s = [s.upper() for s in keychain_sha1s]
          print("Keychain Distribution SHA-1 (with private key):", keychain_sha1s)

          matched = set(profile_cert_sha1s) & set(keychain_sha1s)
          if not keychain_sha1s:
              print("::error::Keychain'de private key'e sahip geçerli bir Apple Distribution sertifikası bulunamadı!")
              sys.exit(1)
          if not matched:
              print(f"::error::Profil içindeki sertifika ({profile_cert_sha1s}) ile Keychain'deki sertifika ({keychain_sha1s}) eşleşmiyor!")
              sys.exit(1)

          print(f"Verified matching certificate SHA-1: {list(matched)}")
          PY

          if ! (
            set -euo pipefail
            if [ ! -f "$PROFILE_FILE" ]; then
              echo "::error::Provisioning profile file not found at $PROFILE_FILE"
              exit 1
            fi

            security cms -D -i "$PROFILE_FILE" > "$RUNNER_TEMP/profile.plist"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist" | tr -d '\r\n ')
            echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

            # Hem klasik Xcode hem Xcode 16+ dizinlerine kur
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            cp "$PROFILE_FILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            cp "$PROFILE_FILE" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

            echo "=== INSTALLED PROFILES IN ~/Library/MobileDevice/Provisioning Profiles/ ==="
            ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

            echo "=== KEYCHAIN SIGNING IDENTITIES ==="
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/identities.txt"

            python3 "$RUNNER_TEMP/verify_signing.py"

            # Yalnızca Runner hedefinin imzalama ayarlarını güncelle (SPM paket hedeflerine dokunmaz)
            fastlane run update_code_signing_settings \
              use_automatic_signing:false \
              path:"Runner.xcodeproj" \
              team_id:"$TEAM_ID" \
              targets:"Runner" \
              code_sign_identity:"Apple Distribution" \
              profile_name:"$PROFILE_SPECIFIER" \
              profile_uuid:"$PROFILE_UUID" \
              bundle_identifier:"$APP_BUNDLE_ID"
          ) 2>&1 | tee "$RUNNER_TEMP/verify.log"; then
            echo "### 6. Profile & Certificate Verification Error" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 "$RUNNER_TEMP/verify.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # ADIM 7: Flutter & iOS Bağımlılıklarını Çözümle
      # -----------------------------------------------------------------------
      - name: 7. Flutter Pub Get & iOS Config
        working-directory: market_app
        run: |
          set -o pipefail
          {
            flutter config --enable-swift-package-manager
            flutter pub get
            flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          } 2>&1 | tee "$RUNNER_TEMP/flutter_build.log"

      # -----------------------------------------------------------------------
      # ADIM 8: Xcode Archive (.xcarchive) Oluştur
      # Not: CODE_SIGN_STYLE=Manual, DEVELOPMENT_TEAM, CODE_SIGN_IDENTITY ve
      # PROVISIONING_PROFILE_SPECIFIER değerleri project.pbxproj içinde yalnızca
      # Runner hedefinde tanımlıdır; böylece SPM paket hedefleri profil hatası vermez.
      # -----------------------------------------------------------------------
      - name: 8. Xcode Archive (Runner.xcarchive)
        working-directory: market_app/ios
        run: |
          set -o pipefail
          if ! xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" 2>&1 | tee "$RUNNER_TEMP/archive.log"; then
            echo "=== XCODE ARCHIVE ERRORS ==="
            grep -E "error:|warning:.*Signing|Provisioning|certificate|requires a" "$RUNNER_TEMP/archive.log" || true
            echo "### 8. Xcode Archive Error Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|warning:.*Signing|Provisioning|certificate|requires a" "$RUNNER_TEMP/archive.log" | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 60 "$RUNNER_TEMP/archive.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 65
          fi

      # -----------------------------------------------------------------------
      # ADIM 9: IPA Dışa Aktar ve App Store Connect (TestFlight)'e Yükle
      # -----------------------------------------------------------------------
      - name: 9. Export Signed IPA & Upload to TestFlight
        working-directory: market_app/ios
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.prestijmarket.app</key>
              <string>${PROFILE_SPECIFIER}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"; then
            echo "### 9. Xcode Export & Upload Error Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 "$RUNNER_TEMP/export.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "### ✅ TestFlight Upload Succeeded!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bundle ID:** \`${APP_BUNDLE_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Provisioning Profile:** \`${PROFILE_SPECIFIER}\` (\`${PROFILE_UUID}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build Number:** \`${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # ADIM 10: Hata veya Başarı Durumunda Logları Artifact Olarak Kaydet
      # -----------------------------------------------------------------------
      - name: 10. Upload Build Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # ADIM 11: Geçici Keychain ve API Anahtarını Temizle
      # -----------------------------------------------------------------------
      - name: 11. Cleanup Keychain and API Key
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
