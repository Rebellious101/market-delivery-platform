name: iOS Release (TestFlight)

# Sadece elle çalışır: GitHub > Actions > "iOS Release (TestFlight)" > Run workflow
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Setup temporary Keychain & App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

          python3 - <<'PY'
          import json, os
          key_id = os.environ["KEY_ID"].strip()
          issuer_id = os.environ["ISSUER_ID"].strip()
          key_content = os.environ["API_KEY_P8"].strip()
          api_json_path = os.path.expanduser("~/private_keys/api_key.json")
          with open(api_json_path, "w") as f:
              json.dump({
                  "key_id": key_id,
                  "issuer_id": issuer_id,
                  "key": key_content,
                  "duration": 1200,
                  "in_house": False,
              }, f)
          PY

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_pass_123"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Fetch or create Signing Certificates & Provisioning Profiles
        working-directory: market_app/ios
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_pass_123"
          API_JSON="$HOME/private_keys/api_key.json"

          # Distribution sertifikası ve App Store profili oluştur / indir
          fastlane run get_certificates \
            api_key_path:"$API_JSON" \
            development:false \
            generate_apple_certs:true \
            keychain_path:"$KEYCHAIN_PATH" \
            keychain_password:"$KEYCHAIN_PASS"

          fastlane run get_provisioning_profile \
            api_key_path:"$API_JSON" \
            app_identifier:"com.prestijmarket.app" \
            development:false \
            force:true

          # Automatic signing archive aşaması için Development sertifikası da bulunsun
          fastlane run get_certificates \
            api_key_path:"$API_JSON" \
            development:true \
            generate_apple_certs:true \
            keychain_path:"$KEYCHAIN_PATH" \
            keychain_password:"$KEYCHAIN_PASS" || true

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Flutter pub get
        working-directory: market_app
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Generate iOS build config (no codesign)
        working-directory: market_app
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archive
        working-directory: market_app/ios
        run: |
          PROFILE_NAME="com.prestijmarket.app AppStore"
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Export and upload to App Store Connect (TestFlight)
        working-directory: market_app/ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Cleanup Keychain and API key
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
